<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d84f91">
<link rel="manifest" href="manifest.json">
<title>CAT Daily Progress Tracker</title>
<style>
:root{--bg:#fff7fb;--card:#ffffff;--ink:#2f2430;--muted:#756875;--accent:#d84f91;--accent2:#7a5cff;--ok:#17845f;--danger:#c43c52;--line:#eadde6;--shadow:0 12px 35px rgba(76,32,63,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:linear-gradient(135deg,#fff7fb,#f4f2ff);color:var(--ink)}
.app{max-width:1120px;margin:auto;padding:24px}.hero{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:6px 0 0;color:var(--muted)}
.badge{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}h2{margin:0 0 14px;font-size:20px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #d9cbd5;border-radius:12px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.timer{text-align:center;padding:12px 0}.clock{font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}.status{color:var(--muted);margin:4px 0 14px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:#eee;color:var(--ink)}button:focus{outline:3px solid rgba(122,92,255,.25)}.primary{background:var(--accent);color:#fff}.secondary{background:var(--accent2);color:#fff}.success{background:var(--ok);color:#fff}.danger{background:#fff0f2;color:var(--danger);border:1px solid #ffd0d8}.wide{width:100%;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar>div{flex:1;min-width:150px}.entries{margin-top:14px;display:grid;gap:10px}.entry{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.entry h3{margin:0 0 4px;font-size:16px}.meta{font-size:12px;color:var(--muted)}.entry p{margin:9px 0 0;white-space:pre-wrap}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#f3efff;color:#5c46b8}.empty{text-align:center;padding:28px;color:var(--muted)}.notice{min-height:22px;margin-top:10px;color:var(--danger);font-size:13px}.footer{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="app">
  <header class="hero"><div><h1>CAT Progress Tracker</h1><p>Daily practice, timed sessions, notes and observations.</p></div><div class="badge" id="todayBadge"></div></header>
  <section class="stats"><div class="stat"><b id="todayMinutes">0</b><span>minutes today</span></div><div class="stat"><b id="todaySessions">0</b><span>sessions today</span></div><div class="stat"><b id="streak">0</b><span>day streak</span></div></section>
  <section class="grid">
    <div class="card">
      <h2>Session timer</h2>
      <div class="timer"><div class="clock" id="clock">00:00:00</div><div class="status" id="timerStatus">Ready to begin</div>
        <div class="actions"><button class="primary" id="startBtn" type="button">Start timer</button><button class="secondary" id="pauseBtn" type="button">Pause</button><button class="success" id="finishBtn" type="button">Finish & log</button><button class="danger" id="resetBtn" type="button">Reset</button></div>
      </div>
      <div class="row"><div><label for="startTime">Start time</label><input id="startTime" type="datetime-local"></div><div><label for="endTime">End time</label><input id="endTime" type="datetime-local"></div></div>
      <div class="row"><div><label for="area">Practice area</label><select id="area"><option>VARC</option><option>DILR</option><option>QA</option><option>Mock Test</option><option>Revision</option><option>Other</option></select></div><div><label for="topic">Topic / task</label><input id="topic" placeholder="e.g. Reading comprehension set"></div></div>
      <div class="row"><div><label for="target">Daily target</label><input id="target" placeholder="e.g. 2 sets / 25 questions"></div><div><label for="progress">Progress achieved</label><input id="progress" placeholder="e.g. 18/25 questions"></div></div>
      <label for="notes">Notes</label><textarea id="notes" placeholder="What did you study or practise?"></textarea>
      <label for="observations">Observations</label><textarea id="observations" placeholder="Accuracy, mistakes, patterns, improvements, next focus..."></textarea>
      <div class="row"><div><label for="mood">Session rating</label><select id="mood"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3" selected>3 - Average</option><option value="2">2 - Difficult</option><option value="1">1 - Poor</option></select></div><div><label for="manualMinutes">Manual duration (minutes, optional)</label><input id="manualMinutes" type="number" min="0" max="1440" placeholder="Auto-calculated if blank"></div></div>
      <button class="primary wide" id="saveBtn" type="button">Save daily progress</button><div class="notice" id="notice" aria-live="polite"></div>
    </div>
    <div class="card">
      <h2>Progress log</h2>
      <div class="toolbar"><div><label for="filterDate">Filter date</label><input id="filterDate" type="date"></div><div><label for="filterArea">Filter area</label><select id="filterArea"><option value="">All areas</option><option>VARC</option><option>DILR</option><option>QA</option><option>Mock Test</option><option>Revision</option><option>Other</option></select></div></div>
      <div class="actions" style="justify-content:flex-start;margin-top:12px"><button id="exportBtn" type="button">Export CSV</button><button id="clearFilterBtn" type="button">Clear filters</button><button class="danger" id="clearAllBtn" type="button">Delete all data</button></div>
      <div class="entries" id="entries"></div>
    </div>
  </section>
  <div class="footer">Data is stored locally in this browser. Export a CSV regularly as a backup.</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), KEY='catTrackerEntriesV1', TIMER='catTrackerTimerV1';
let tick=null, state=loadTimer();
function pad(n){return String(n).padStart(2,'0')} function localInput(d){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}
function fmtDuration(s){s=Math.max(0,Math.floor(s));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function elapsed(){if(!state.startedAt)return state.elapsed||0;return (state.elapsed||0)+(state.running?Math.floor((Date.now()-state.resumedAt)/1000):0)}
function saveTimer(){localStorage.setItem(TIMER,JSON.stringify(state))} function loadTimer(){try{return JSON.parse(localStorage.getItem(TIMER))||{running:false,elapsed:0}}catch{return{running:false,elapsed:0}}}
function renderTimer(){$('clock').textContent=fmtDuration(elapsed());$('timerStatus').textContent=state.running?'Timer running':state.startedAt?'Timer paused':'Ready to begin';$('startBtn').textContent=state.startedAt&&!state.running?'Resume timer':'Start timer'}
function beginTick(){clearInterval(tick);if(state.running)tick=setInterval(renderTimer,1000)}
$('startBtn').addEventListener('click',()=>{if(!state.startedAt){state.startedAt=Date.now();state.elapsed=0;$('startTime').value=localInput(new Date(state.startedAt))}state.resumedAt=Date.now();state.running=true;saveTimer();renderTimer();beginTick()});
$('pauseBtn').addEventListener('click',()=>{if(!state.running)return;state.elapsed=elapsed();state.running=false;saveTimer();renderTimer();beginTick()});
function finish(){if(!state.startedAt){msg('Start the timer before finishing.');return false}if(state.running)state.elapsed=elapsed();state.running=false;state.endedAt=Date.now();$('endTime').value=localInput(new Date(state.endedAt));$('manualMinutes').value=Math.max(1,Math.round(state.elapsed/60));saveTimer();renderTimer();beginTick();return true}
$('finishBtn').addEventListener('click',()=>{if(finish())saveEntry(true)});
$('resetBtn').addEventListener('click',()=>{state={running:false,elapsed:0};localStorage.removeItem(TIMER);$('startTime').value='';$('endTime').value='';$('manualMinutes').value='';renderTimer();beginTick();msg('Timer reset. Form details were kept.','ok')});
function entries(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}} function write(a){localStorage.setItem(KEY,JSON.stringify(a))}
function msg(t,type){$('notice').style.color=type==='ok'?'var(--ok)':'var(--danger)';$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},3500)}
function saveEntry(fromTimer=false){let start=$('startTime').value,end=$('endTime').value,mins=Number($('manualMinutes').value);if(!mins&&start&&end)mins=Math.max(0,Math.round((new Date(end)-new Date(start))/60000));if(!start)start=localInput(new Date());if(!end)end=localInput(new Date());if(new Date(end)<new Date(start)){msg('End time cannot be earlier than start time.');return}if(!$('topic').value.trim()&&!$('notes').value.trim()){msg('Add a topic or a note before saving.');return}let rec={id:Date.now(),date:start.slice(0,10),start,end,minutes:Math.max(0,Math.min(1440,mins||0)),area:$('area').value,topic:$('topic').value.trim(),target:$('target').value.trim(),progress:$('progress').value.trim(),notes:$('notes').value.trim(),observations:$('observations').value.trim(),rating:Number($('mood').value)};let a=entries();a.unshift(rec);write(a);clearForm();state={running:false,elapsed:0};localStorage.removeItem(TIMER);renderTimer();renderAll();msg(fromTimer?'Session finished and logged.':'Progress saved.','ok')}
$('saveBtn').addEventListener('click',()=>saveEntry(false));
function clearForm(){['startTime','endTime','topic','target','progress','notes','observations','manualMinutes'].forEach(id=>$(id).value='');$('mood').value='3'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pretty(x){return x?new Date(x).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'Not recorded'}
function renderEntries(){let a=entries(),d=$('filterDate').value,ar=$('filterArea').value;a=a.filter(x=>(!d||x.date===d)&&(!ar||x.area===ar));$('entries').innerHTML=a.length?a.map(x=>`<article class="entry"><div class="entry-top"><div><h3>${esc(x.topic||'Untitled session')}</h3><div class="meta">${esc(x.area)} · ${pretty(x.start)} to ${pretty(x.end)} · ${x.minutes} min</div></div><button class="danger delete" data-id="${x.id}" type="button">Delete</button></div><div class="chips"><span class="chip">Rating ${x.rating}/5</span>${x.target?`<span class="chip">Target: ${esc(x.target)}</span>`:''}${x.progress?`<span class="chip">Progress: ${esc(x.progress)}</span>`:''}</div>${x.notes?`<p><b>Notes:</b> ${esc(x.notes)}</p>`:''}${x.observations?`<p><b>Observations:</b> ${esc(x.observations)}</p>`:''}</article>`).join(''):'<div class="empty">No progress entries found.</div>';document.querySelectorAll('.delete').forEach(b=>b.addEventListener('click',()=>{write(entries().filter(x=>x.id!==Number(b.dataset.id)));renderAll()}))}
function dayKey(d){return new Date(d+'T00:00:00')} function renderStats(){let a=entries(),today=new Date().toISOString().slice(0,10),ta=a.filter(x=>x.date===today);$('todayMinutes').textContent=ta.reduce((s,x)=>s+x.minutes,0);$('todaySessions').textContent=ta.length;let days=[...new Set(a.map(x=>x.date))].sort().reverse(),st=0,cur=new Date();cur.setHours(0,0,0,0);if(!days.includes(today))cur.setDate(cur.getDate()-1);while(days.includes(cur.toISOString().slice(0,10))){st++;cur.setDate(cur.getDate()-1)}$('streak').textContent=st}
function renderAll(){renderEntries();renderStats()}
$('filterDate').addEventListener('change',renderEntries);$('filterArea').addEventListener('change',renderEntries);$('clearFilterBtn').addEventListener('click',()=>{$('filterDate').value='';$('filterArea').value='';renderEntries()});
$('clearAllBtn').addEventListener('click',()=>{if(confirm('Delete every CAT progress entry? This cannot be undone.')){localStorage.removeItem(KEY);renderAll()}});
$('exportBtn').addEventListener('click',()=>{let a=entries();if(!a.length){msg('There is no data to export.');return}let cols=['date','start','end','minutes','area','topic','target','progress','notes','observations','rating'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[cols.join(','),...a.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='CAT_progress_'+new Date().toISOString().slice(0,10)+'.csv';link.click();URL.revokeObjectURL(u)});
$('todayBadge').textContent=new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderTimer();beginTick();renderAll();
})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));</script>
</body>
</html>
